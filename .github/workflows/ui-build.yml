name: UI — Build & Deploy (local runner)
on:
  push:
    branches: [ staging, main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: [self-hosted, Linux, X64, ui]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Deploy to staging
        if: github.ref_name == 'staging'
        run: |
          sudo mkdir -p /var/www/staging.raulhoyos.com
          sudo rsync -a --delete dist/ /var/www/staging.raulhoyos.com/
          sudo chown -R www-data:www-data /var/www/staging.raulhoyos.com

      - name: Deploy to prod
        if: github.ref_name == 'main'
        run: |
          sudo mkdir -p /var/www/raulhoyos.com
          sudo rsync -a --delete dist/ /var/www/raulhoyos.com/
          sudo chown -R www-data:www-data /var/www/raulhoyos.com